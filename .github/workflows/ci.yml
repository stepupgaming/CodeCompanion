name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  format:
    name: format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run format:check

  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run lint

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    # Windows is the supported platform. Linux and macOS report their result without blocking the build until their
    # pre-existing failures are fixed (see TASKS.md): node-pty cannot spawn a shell on the macOS runners
    # ("posix_spawnp failed") and a background-child unit test flakes there, and on Linux the long_run streaming
    # end-to-end test times out. Both reproduce on upstream main.
    continue-on-error: ${{ matrix.os != 'windows-latest' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # npm 11 skips install scripts unless allowed in package.json; make sure the Electron binary is there.
      - run: node node_modules/electron/install.js

      - run: npm run typecheck
      - run: npm run test:unit

      # Electron needs a display on Linux.
      - run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run -a npm run test:e2e
          else
            npm run test:e2e
          fi
        shell: bash
