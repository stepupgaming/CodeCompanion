name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  format:
    name: format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run format:check

  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run lint

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # npm 11 skips install scripts unless allowed in package.json; make sure the Electron binary is there.
      - run: node node_modules/electron/install.js

      - run: npm run typecheck
      - run: npm run test:unit

      # Electron needs a display on Linux; macOS e2e is the one known failure on hosted runners: node-pty cannot
      # spawn the shell there ("posix_spawnp failed"), which predates this workflow change and needs a debugging
      # session on macOS. Everything else is blocking; see TASKS.md.
      - run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run -a npm run test:e2e
          else
            npm run test:e2e
          fi
        shell: bash
        continue-on-error: ${{ runner.os == 'macOS' }}
